<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Árbol familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#f6f1e7; --tarjeta:#fffdf8; --tinta:#2e2a23; --tinta-suave:#877c66;
    --borde:#e2d8c3; --borde-oscuro:#b6a88a; --verde:#3f5346; --terracota:#a65b41;
  }
  *{ box-sizing:border-box; margin:0; padding:0 }
  body{
    font-family:"Segoe UI", Roboto, system-ui, sans-serif;
    background:var(--papel); color:var(--tinta);
    min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .candado{ width:100%; max-width:330px; text-align:center }
  .monograma{
    width:68px; height:68px; margin:0 auto 22px; border:1px solid var(--borde-oscuro);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:Fraunces, Georgia, serif; font-size:22px; letter-spacing:2px; color:var(--verde);
  }
  h1{ font-family:Fraunces, Georgia, serif; font-weight:600; font-size:27px; line-height:1.2; margin-bottom:6px }
  .sub{ font-size:14px; color:var(--tinta-suave); margin-bottom:26px }
  form{ display:flex; flex-direction:column; gap:10px }
  input{
    padding:12px 14px; font:inherit; font-size:15px; text-align:center;
    border:1px solid var(--borde); border-radius:9px; background:var(--tarjeta); color:var(--tinta);
  }
  input:focus{ outline:none; border-color:var(--borde-oscuro) }
  button{
    padding:12px; font:inherit; font-size:15px; border:none; border-radius:9px;
    background:var(--verde); color:#fdfbf5; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:wait }
  #error{ margin-top:14px; font-size:13.5px; color:var(--terracota) }
  #error[hidden]{ display:none }
  .sacudir{ animation:sacudida .4s ease }
  @keyframes sacudida{
    0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-7px) }
    50%{ transform:translateX(6px) } 75%{ transform:translateX(-4px) }
  }
  .pie{ margin-top:34px; font-size:12px; color:var(--tinta-suave) }
</style>
</head>
<body>
<main class="candado" id="caja">
  <div class="monograma" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="8.5" r="5"/>
      <path d="M12 13.5V21"/>
      <path d="M7.5 21h9"/>
    </svg>
  </div>
  <h1>Árbol familiar</h1>
  <p class="sub">Se abre con la clave de la familia</p>
  <form id="forma">
    <input type="password" id="clave" placeholder="Clave de la familia" autocomplete="current-password" autofocus>
    <button id="boton" type="submit">Entrar</button>
  </form>
  <p id="error" hidden></p>
  <p class="pie">Página familiar privada</p>
</main>

<noscript><p style="text-align:center; padding:20px">Esta página necesita JavaScript para abrirse.</p></noscript>

const forma = document.getElementById('forma');
const campo = document.getElementById('clave');
const boton = document.getElementById('boton');
const error = document.getElementById('error');
const caja = document.getElementById('caja');

function b64aBytes(b64){
  const s = atob(b64);
  const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}
function unir(a, b){
  const r = new Uint8Array(a.length + b.length);
  r.set(a); r.set(b, a.length);
  return r;
}

async function descifrar(clave){
  const sal = b64aBytes(PAQUETE.sal);
  const nonce = b64aBytes(PAQUETE.nonce);
  const cifrado = b64aBytes(PAQUETE.datos);
  const etiqueta = b64aBytes(PAQUETE.etiqueta);

  // Deriva 64 bytes de la clave: 32 para descifrar y 32 para la etiqueta
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name:'PBKDF2', hash:'SHA-256', salt: sal, iterations: PAQUETE.iteraciones }, material, 512));
  const kCif = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const kMac = await crypto.subtle.importKey('raw', bits.slice(32), { name:'HMAC', hash:'SHA-256' }, false, ['sign']);

  // Primero verifica la etiqueta: si la clave no es, aquí se detiene
  const etiquetaCalc = new Uint8Array(await crypto.subtle.sign('HMAC', kMac, unir(nonce, cifrado)));
  if (etiquetaCalc.length !== etiqueta.length || !etiqueta.every((v, i) => v === etiquetaCalc[i])){
    throw new Error('clave-incorrecta');
  }

  // Genera el flujo de descifrado por bloques de 32 bytes y hace XOR
  const totalBloques = Math.ceil(cifrado.length / 32);
  const claro = new Uint8Array(cifrado.length);
  const LOTE = 256;
  for (let desde = 0; desde < totalBloques; desde += LOTE){
    const hasta = Math.min(desde + LOTE, totalBloques);
    const promesas = [];
    for (let i = desde; i < hasta; i++){
      const entrada = new Uint8Array(nonce.length + 4);
      entrada.set(nonce);
      new DataView(entrada.buffer).setUint32(nonce.length, i, false);
      promesas.push(crypto.subtle.sign('HMAC', kCif, entrada));
    }
    const bloques = await Promise.all(promesas);
    for (let i = desde; i < hasta; i++){
      const ks = new Uint8Array(bloques[i - desde]);
      const inicio = i * 32, fin = Math.min(inicio + 32, cifrado.length);
      for (let j = inicio; j < fin; j++) claro[j] = cifrado[j] ^ ks[j - inicio];
    }
  }
  return new TextDecoder().decode(claro);
}

async function intentar(clave, silencioso){
  boton.disabled = true;
  boton.textContent = 'Abriendo…';
  try {
    const pagina = await descifrar(clave);
    try { sessionStorage.setItem('arbolClave', clave); } catch (e) {}
    document.open();
    document.write(pagina);
    document.close();
  } catch (e) {
    boton.disabled = false;
    boton.textContent = 'Entrar';
    try { sessionStorage.removeItem('arbolClave'); } catch (err) {}
    if (!silencioso){
      error.textContent = 'La clave no es. Inténtalo de nuevo.';
      error.hidden = false;
      caja.classList.remove('sacudir'); void caja.offsetWidth;
      caja.classList.add('sacudir');
      campo.select();
    }
  }
}

forma.addEventListener('submit', e => {
  e.preventDefault();
  const clave = campo.value.trim();
  if (clave) intentar(clave, false);
});

// Si la clave ya se escribió en esta pestaña, abre directo
try {
  const guardada = sessionStorage.getItem('arbolClave');
  if (guardada && PAQUETE) intentar(guardada, true);
} catch (e) {}
